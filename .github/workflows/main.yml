name: Download Dukascopy Ticks

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Symbol (e.g. EURUSD, XAUUSD)"
        required: true
        default: "EURUSD"
      start:
        description: "Start date/time UTC (YYYY-MM-DD or YYYY-MM-DD HH:MM)"
        required: true
      end:
        description: "End date/time UTC (exclusive)"
        required: true
      format:
        description: "Output format"
        required: true
        type: choice
        default: "mt5"
        options:
          - mt5
          - raw
      tz_shift:
        description: "Hours to add to UTC so timestamps match your broker server time (mt5 only, e.g. 2 or 3)"
        required: false
        default: "0"
  schedule:
    # Every day at 02:00 UTC — downloads the previous day for symbols listed in SCHEDULED_SYMBOLS
    - cron: "0 2 * * *"

env:
  SCHEDULED_SYMBOLS: "EURUSD GBPUSD XAUUSD"

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # Git tags cannot contain whitespace or most punctuation. Inputs typed by hand
      # often carry a trailing space (e.g. "nzdusd "), which previously produced an
      # invalid tag and left the release stuck as a draft.
      - name: Normalize inputs
        id: norm
        if: github.event_name == 'workflow_dispatch'
        env:
          RAW_SYMBOL: ${{ inputs.symbol }}
          RAW_START: ${{ inputs.start }}
          RAW_END: ${{ inputs.end }}
        run: |
          SYMBOL=$(printf '%s' "$RAW_SYMBOL" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]' | tr -cd 'A-Z0-9._-')
          START=$(printf '%s' "$RAW_START" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          END=$(printf '%s' "$RAW_END" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$SYMBOL" ]; then
            echo "::error::Symbol is empty after normalization"
            exit 1
          fi
          echo "symbol=$SYMBOL" >> "$GITHUB_OUTPUT"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "Symbol: '$SYMBOL'  Start: '$START'  End: '$END'"

      - name: Download (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p data
          python scripts/dukascopy_ticks.py "${{ steps.norm.outputs.symbol }}" "${{ steps.norm.outputs.start }}" "${{ steps.norm.outputs.end }}" \
            --format "${{ inputs.format }}" --tz-shift "${{ inputs.tz_shift || '0' }}" \
            -o "data/${{ steps.norm.outputs.symbol }}.csv"

      - name: Download (scheduled, previous day)
        if: github.event_name == 'schedule'
        run: |
          mkdir -p data
          START=$(date -u -d "yesterday" +%F)
          END=$(date -u +%F)
          for SYMBOL in $SCHEDULED_SYMBOLS; do
            python scripts/dukascopy_ticks.py "$SYMBOL" "$START" "$END" --format mt5 -o "data/${SYMBOL}_${START}.csv"
          done

      - name: Build release name and zip CSVs
        id: pack
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SYMBOL="${{ steps.norm.outputs.symbol }}"
            START=$(echo "${{ steps.norm.outputs.start }}" | cut -d' ' -f1)
            END=$(echo "${{ steps.norm.outputs.end }}" | cut -d' ' -f1)
            TAG="ticks-${SYMBOL}-${START}_${END}"
            TITLE="${SYMBOL} ticks ${START} to ${END}"
          else
            DAY=$(date -u -d "yesterday" +%F)
            TAG="ticks-daily-${DAY}"
            TITLE="Daily ticks ${DAY} (${SCHEDULED_SYMBOLS})"
          fi

          # Final safety net: strip anything git does not allow in a tag name
          TAG=$(printf '%s' "$TAG" | tr -cd 'A-Za-z0-9._-')
          if ! git check-ref-format "refs/tags/$TAG"; then
            echo "::error::Generated tag '$TAG' is not a valid git tag"
            exit 1
          fi

          ZIP="${TAG}.zip"
          zip -j -9 "$ZIP" data/*.csv
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG"
          ls -lh "$ZIP"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          name: ${{ steps.pack.outputs.title }}
          files: ${{ steps.pack.outputs.zip }}
          body: |
            Dukascopy tick data exported by GitHub Actions.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
