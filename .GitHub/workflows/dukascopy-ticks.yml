name: Download Dukascopy Ticks

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Symbol (e.g. EURUSD, XAUUSD)"
        required: true
        default: "EURUSD"
      start:
        description: "Start date/time UTC (YYYY-MM-DD or YYYY-MM-DD HH:MM)"
        required: true
      end:
        description: "End date/time UTC (exclusive)"
        required: true
  schedule:
    # Every day at 02:00 UTC — downloads the previous day for symbols listed in SCHEDULED_SYMBOLS
    - cron: "0 2 * * *"

env:
  SCHEDULED_SYMBOLS: "EURUSD GBPUSD XAUUSD"

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Download (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p data
          python scripts/dukascopy_ticks.py "${{ inputs.symbol }}" "${{ inputs.start }}" "${{ inputs.end }}" \
            -o "data/${{ inputs.symbol }}.csv"

      - name: Download (scheduled, previous day)
        if: github.event_name == 'schedule'
        run: |
          mkdir -p data
          START=$(date -u -d "yesterday" +%F)
          END=$(date -u +%F)
          for SYMBOL in $SCHEDULED_SYMBOLS; do
            python scripts/dukascopy_ticks.py "$SYMBOL" "$START" "$END" -o "data/${SYMBOL}_${START}.csv"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dukascopy-ticks-${{ github.run_id }}
          path: data/*.csv
          retention-days: 30
